name: Build

on:
  pull_request:
    paths:
      - '**.js'
      - '**.ts'
      - '**.html'
      - '**.scss'
      - '**.json'
      - '**.yml'
    branches: [master]
  push:
    paths:
      - '**.js'
      - '**.ts'
      - '**.html'
      - '**.scss'
      - '**.json'
      - '**.yml'
    branches: [master]
  schedule:
    - cron: '0 9 * * 1,2,3,4,5'

jobs:
  build:
    name: Build app
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Cache node modules
        id: cache-nodemodules
        uses: actions/cache@v3
        env:
          cache-name: cache-node-modules
        with:
          path: node_modules
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Install dependencies
        run: |
          npm install

      - name: Build app
        run: |
          npm run build:ci
